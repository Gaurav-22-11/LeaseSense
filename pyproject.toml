[project]
name = "leasesense"
version = "0.1.0"
description = "Local-first AI lease analysis MVP for renters"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.35.0",
  "docling>=2.15.0",
  "qdrant-client>=1.9.1",
  "sentence-transformers>=3.0.1",
  "torch>=2.2.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]
llama-cpp = ["llama-cpp-python>=0.2.80"]
transformers = ["transformers>=4.42.0", "accelerate>=0.31.0"]

[tool.setuptools.packages.find]
include = ["leasesense*", "src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = [".venv", "data", ".data", "pytest-cache-files-*", "__pycache__"]
